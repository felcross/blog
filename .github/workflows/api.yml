name: API CI/CD

on:
  push:
    branches: [main]
    paths:
      - "apps/api/**"
      - "docker-compose.prod.yml"
      - ".github/workflows/api.yml"
      - "scripts/smoke.sh"

# Um único grupo: api e web nunca fazem deploy ao mesmo tempo
concurrency:
  group: deploy-vps
  cancel-in-progress: false

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: blog
          POSTGRES_PASSWORD: blog
          POSTGRES_DB: blog
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://blog:blog@localhost:5432/blog
      ADMIN_EMAIL: admin@example.com
      WEB_URL: http://localhost:5173
      SESSION_SECRET: ci-test-secret-16chars
      SMTP_HOST: localhost
      SMTP_PORT: "1025"
      SMTP_FROM: "Blog <noreply@blog.local>"
      NODE_ENV: test
      REDIS_URL: redis://localhost:6379
      EMAIL_BACKOFF_MS: "50"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"
      # gera o client Prisma antes do tsc (senão os tipos não existem)
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter api exec prisma generate
      - run: pnpm --filter api lint
      - run: pnpm --filter api exec prisma migrate deploy
      - run: pnpm --filter api test

  deploy:
    runs-on: ubuntu-latest
    needs: lint-and-test
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd /root/blog
            git pull
            docker compose -f docker-compose.prod.yml --env-file .env -p blog up -d --build
            ./scripts/smoke.sh
